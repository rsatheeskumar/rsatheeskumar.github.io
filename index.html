<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Satheeskumar Rajasekaran — Senior Data Engineer & AI Solutions Architect</title>
    <meta name="description" content="Data and AI architect with 20+ years of experience across financial services, data engineering, analytics, and enterprise platforms." />
    <meta property="og:title" content="Satheeskumar Rajasekaran — Senior Data Engineer & AI Solutions Architect" />
    <meta property="og:description" content="Data and AI architect with 20+ years of experience across financial services, data engineering, analytics, and enterprise platforms." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/assets/index-DXhhsPtk.css" />
    <script type="module">
      try {
        const handle = 'satheeskumar';
        const params = new URLSearchParams(location.search);
        const requestedHandle = (params.get('u') || params.get('user') || handle).trim().toLowerCase();
        if (requestedHandle === handle) {
          const response = await fetch('/data/published-portfolio.json', { cache: 'no-store' });
          if (!response.ok) {
            throw new Error(`Portfolio data request failed: ${response.status}`);
          }

          const snapshot = await response.json();
          if (
            snapshot.handle !== handle ||
            !snapshot.publishedAt ||
            !snapshot.profile ||
            !Array.isArray(snapshot.projects) ||
            !Array.isArray(snapshot.insights) ||
            !Array.isArray(snapshot.mediaCarousels)
          ) {
            throw new Error('Published portfolio data is incomplete or has an unexpected handle.');
          }

          const prefix = 'satheeskumar_portfolio_';
          const versionKey = `${prefix}static_snapshot_version`;
          const profileKey = `${prefix}profile_${handle}`;
          const projectsKey = `${prefix}projects_${handle}`;
          const insightsKey = `${prefix}insights`;
          const carouselsKey = `${prefix}carousels`;
          let savedProfile = {};
          try {
            savedProfile = JSON.parse(localStorage.getItem(profileKey) || '{}');
          } catch (error) {
            console.warn('Ignoring malformed locally saved profile data.', error);
          }
          const profile = {
            ...snapshot.profile,
            ...savedProfile,
            name: snapshot.profile.name,
            role: snapshot.profile.role,
            summary: snapshot.profile.summary,
            overview: snapshot.profile.overview,
          };
          if (!profile.avatarUrl) {
            profile.avatarUrl = '/src/assets/images/satheeskumar_profile.jpg';
          }
          localStorage.setItem(profileKey, JSON.stringify(profile));

          if (
            localStorage.getItem(versionKey) !== snapshot.publishedAt ||
            !localStorage.getItem(projectsKey) ||
            !localStorage.getItem(insightsKey) ||
            !localStorage.getItem(carouselsKey)
          ) {
            localStorage.setItem(projectsKey, JSON.stringify(snapshot.projects));
            localStorage.setItem(insightsKey, JSON.stringify(snapshot.insights));
            localStorage.setItem(carouselsKey, JSON.stringify(snapshot.mediaCarousels));
            localStorage.setItem(versionKey, snapshot.publishedAt);
          }
        }
        await import('/assets/index-OdSzPk4T.js');
      } catch (error) {
        console.error('Unable to load the published portfolio data.', error);
        const root = document.getElementById('root');
        if (root) {
          root.textContent = 'The portfolio could not load its published content. Please refresh the page.';
        }
      }
    </script>
  </head>
  <body class="bg-neutral-950 text-neutral-100 antialiased selection:bg-neutral-800 selection:text-white">
    <div id="root"></div>
    <script>
      const url = new URL(window.location.href);
      if (!url.searchParams.has('u') && !url.searchParams.has('user') && !url.searchParams.has('edit')) {
        url.searchParams.set('u', 'satheeskumar');
        window.history.replaceState(null, '', url);
      }
    </script>
  </body>
</html>
